name: LeetCode Sync

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync LeetCode Problems
        uses: joshcai/leetcode-sync@v1.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-cookie: ${{ secrets.LEETCODE_COOKIE }}
